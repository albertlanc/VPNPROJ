user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        # listen 443 ssl; # Uncomment this later when you add SSL certificates
        
        server_name _;

        # 1. Route Xray VLESS WebSocket
        location /vless {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }

        # 2. Route Xray VMess WebSocket
        location /vmess {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }

        # 3. Route SSH over WebSocket
        location /ssh {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }

        # Fallback / Dummy Web Page for unauthorized scanning
        location / {
            add_header Content-Type text/plain;
            return 200 "VPN Server Active\n";
        }
    }
}
